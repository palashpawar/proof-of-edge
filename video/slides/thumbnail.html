<!doctype html>
<html><head><meta charset="utf-8"><title>Proof of Edge thumbnail</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body {
    background:
      radial-gradient(900px 600px at 85% 30%, rgba(67,196,138,.20), transparent 60%),
      radial-gradient(800px 600px at 10% 90%, rgba(122,162,255,.22), transparent 60%),
      #0a0d13;
    color: #f2f4f8; font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
    display: grid; grid-template-columns: 1fr 430px; grid-template-rows: 1fr auto;
    column-gap: 52px; row-gap: 30px; padding: 58px 64px 52px;
  }
  .left { display: flex; flex-direction: column; justify-content: center; }
  .kicker { font-size: 21px; font-weight: 700; letter-spacing: .14em; color: #8fb0ff; text-transform: uppercase; }
  h1 { margin-top: 22px; font-weight: 900; letter-spacing: -0.045em; line-height: .95; white-space: nowrap; }
  h1 .l1 { display: block; font-size: 104px; }
  h1 .l2 { display: block; font-size: 84px; color: #b8bfcc; font-weight: 800; letter-spacing: -0.035em; margin-top: 6px; }
  h1 .edge { color: #43c48a; }
  .sub { font-size: 29px; line-height: 1.25; color: #c4c9d4; margin-top: 28px; max-width: 640px; font-weight: 500; }
  .sub b { color: #fff; }
  .right { display: flex; flex-direction: column; justify-content: center; gap: 20px; }
  .card { background: rgba(20,24,33,.92); border: 1px solid rgba(255,255,255,.12); border-radius: 22px; padding: 24px 28px 14px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .card h2 { font-size: 19px; letter-spacing: .12em; text-transform: uppercase; color: #9aa3b2; font-weight: 700; margin-bottom: 6px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 13px 0; border-top: 1px solid rgba(255,255,255,.08); }
  .row:first-of-type { border-top: 0; }
  .name { font-size: 30px; font-weight: 800; line-height: 1.05; }
  .n { display: block; font-size: 16px; color: #9aa3b2; font-weight: 600; margin-top: 3px; }
  .val { font: 800 40px/1 ui-monospace, "SF Mono", Menlo, monospace; }
  .pos { color: #43c48a; } .neg { color: #ff7b72; } .zero { color: #c4c9d4; }
  .formula { font: 700 28px/1 ui-monospace, "SF Mono", Menlo, monospace; background: rgba(122,162,255,.14); border: 1px solid rgba(122,162,255,.35); color: #dfe7ff; border-radius: 16px; padding: 18px 20px; text-align: center; }
  .chips { grid-column: 1 / -1; display: flex; gap: 12px; }
  .chip { font-size: 21px; font-weight: 700; padding: 9px 18px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); }
</style></head>
<body>
  <div class="left">
    <div class="kicker">AI agents · Prediction markets · Arc</div>
    <h1><span class="l1">Pay for <span class="edge">edge</span>,</span><span class="l2">not for data.</span></h1>
    <p class="sub">Forecasters get paid <b>only when they beat the market</b>, settled on-chain.</p>
  </div>
  <div class="right">
    <div class="card">
      <h2>Live seller edge Δ</h2>
      <div id="rows"></div>
    </div>
    <div class="formula">Δ = (m − y)² − (p − y)²</div>
  </div>
  <div class="chips">
    <span class="chip">Claude agent</span><span class="chip">x402</span><span class="chip">Arc</span><span class="chip">Gemini</span><span class="chip">QuickNode</span><span class="chip">ERC-8004</span>
  </div>
<script>
  // Filled by thumbnail.mjs with live /api/state numbers: [{id, n, mean}]
  window.fill = (sellers) => {
    document.getElementById("rows").innerHTML = sellers.map((s) => {
      const cls = s.mean > 0.0005 ? "pos" : s.mean < -0.0005 ? "neg" : "zero";
      const txt = `${s.mean > 0.0005 ? "+" : s.mean < -0.0005 ? "−" : ""}${Math.abs(s.mean).toFixed(3)}`;
      return `<div class="row"><span class="name">${s.id}<span class="n">${s.n} settled swaps</span></span><span class="val ${cls}">${txt}</span></div>`;
    }).join("");
  };
</script>
</body></html>
