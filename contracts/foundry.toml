[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# Arc targets Prague/Osaka; prague is the safe common baseline.
evm_version = "prague"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 2000

[rpc_endpoints]
arc_testnet = "${ARC_RPC_URL}"
